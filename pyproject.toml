[project]
name = "online-store"
version = "0.1.0"
description = "Домашка ООП - интернет-магазин"
authors = [
    {name = "Student"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = []

[tool.poetry]
packages = [{include = "src"}]

[dependency-groups]
dev = [
    "pytest (>=8.0.0,<9.0.0)",
    "pytest-cov (>=5.0.0,<7.0.0)",
    "flake8 (>=7.0.0,<8.0.0)",
    "black (>=24.0.0,<26.0.0)",
    "isort (>=5.13.0,<7.0.0)",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.black]
line-length = 119

[tool.isort]
line_length = 119

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
